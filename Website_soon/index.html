<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOWER | EV Production Prep</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Space Grotesk', sans-serif;
            background-color: #000000;
            background-image: url('gpt_vower.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            color: #ffffff;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.95) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 3.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .top-left-brand {
            display: flex;
            align-items: center;
        }

        .top-left-logo-crop {
            width: 220px; 
            height: 80px; 
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-left-logo-crop img {
            position: absolute;
            width: 280px;
            height: auto;
            object-fit: cover;
            filter: invert(1) grayscale(100%) brightness(200%); 
        }

        .top-right-socials {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .top-right-socials a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: transform 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: center;
        }

        .top-right-socials a:hover {
            color: #ffffff;
            transform: translateY(-2px);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .top-right-socials svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .coming-soon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .coming-soon-container span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4.5vw; 
            font-weight: 300;
            letter-spacing: 0.3rem;
            line-height: 1;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .bottom-left {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 420px;
        }

        .tagline {
            font-size: 1.25rem;
            letter-spacing: 0.15rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            line-height: 1.4;
        }

        .helper-text {
            font-size: 0.75rem;
            line-height: 1.5;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.05rem;
        }

        .bottom-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.8rem;
        }

        .prep-phase {
            font-size: 0.7rem;
            letter-spacing: 0.4rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .container { padding: 1.5rem; }
            .coming-soon-container span { font-size: 2.2rem; letter-spacing: 0.15rem; }
            main { flex-direction: column; align-items: center; gap: 2rem; }
            .bottom-left, .bottom-right { align-items: center; text-align: center; max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="top-left-brand">
                <div class="top-left-logo-crop">
                    <img src="WORDLOGON.png" alt="VOWER Logo">
                </div>
            </div>
            <div class="top-right-socials">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </a>
                <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="X">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                    <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </a>
            </div>
        </header>

        <div class="center-logo">
            <div class="coming-soon-container">
                <span>COMING<br>SOON</span>
            </div>
        </div>

        <main>
            <div class="bottom-left">
                <p class="tagline">The Future of EV Charging, Connected in One Platform</p>
                <p class="helper-text">Connecting EV drivers with a unified network of charging stations and providers for a seamless, reliable, and smarter charging experience.</p>
            </div>
            
            <div class="bottom-right">
                <p class="prep-phase">PRODUCTION PREP /// 2026</p>
            </div>
        </main>
    </div>

</body>
</html>
